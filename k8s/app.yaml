apiVersion: v1
kind: Service
metadata:
  name: shortlink
  namespace: shortlink
  labels: {app: shortlink}
spec:
  selector: {app: shortlink}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink
  namespace: shortlink
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: shortlink}
  template:
    metadata:
      labels: {app: shortlink}
    spec:
      containers:
        - name: app
          image: shortlink:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: shortlink-config}
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: shortlink-secret, key: DB_PASSWORD}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortlink
  namespace: shortlink
spec:
  ingressClassName: traefik
  rules:
    - host: shortlink.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: shortlink, port: {number: 8080}}
