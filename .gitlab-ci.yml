stages: [lint, build, push, deploy]

variables:
  IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE/shortlink"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

.tooling:
  image: docker:27.2.0-cli
  before_script:
    - apk add --no-cache bash python3 py3-pip shellcheck ansible
    - pip install --break-system-packages yamllint ansible-lint
    - ansible-galaxy collection install ansible.posix community.general
    - wget -qO /usr/local/bin/kubectl https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
    - chmod +x /usr/local/bin/kubectl

lint:
  extends: .tooling
  stage: lint
  script:
    - bash ci/run-stage.sh lint

build:
  extends: .tooling
  stage: build
  services: [docker:27.2.0-dind]
  script:
    - bash ci/run-stage.sh build
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

push:
  extends: .tooling
  stage: push
  services: [docker:27.2.0-dind]
  script:
    - docker load --input image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - bash ci/run-stage.sh push
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'

deploy:
  extends: .tooling
  stage: deploy
  script:
    - export REGISTRY_SERVER="$CI_REGISTRY" REGISTRY_USER="$CI_REGISTRY_USER" REGISTRY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - bash ci/run-stage.sh deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual
  environment:
    name: production
