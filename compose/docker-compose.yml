services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: {context: ../app}
    image: shortlink:${IMAGE_TAG:-dev}
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  registry:
    image: registry:2.8.3
    ports: ["${REGISTRY_PORT:-5001}:5000"]
    restart: unless-stopped
volumes:
  postgres_data:
