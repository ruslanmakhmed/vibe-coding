apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: shortlink
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: shortlink
        metrics_path: /metrics
        static_configs:
          - targets: ["shortlink:8080"]
    alerting: {}
  alerts.yml: |
    groups:
      - name: shortlink
        rules:
          - alert: ShortlinkUnavailable
            expr: up{job="shortlink"} == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Shortlink scrape target is unavailable
              description: Prometheus has failed to scrape shortlink for more than one minute.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: shortlink
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{name: web, containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: shortlink
spec:
  selector: {app: prometheus}
  ports: [{name: web, port: 9090, targetPort: 9090}]
